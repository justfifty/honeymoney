# Publish honeymoney.app's front door from GitHub, so that fixing the site
# never again depends on a keyboard attached to one particular laptop.
#
# ── WHY THIS EXISTS ────────────────────────────────────────────────────────
#
# On 2026-09-08 the site served every app page as raw HTML — no stylesheet, no
# hydration, a tab bar that was a line of links. The fixes were on a branch
# within the hour. They then sat there, because the only deploy path was
# `npm run site:publish` on the laptop that serves the origin, and the only
# person around had a phone. A fix that exists and cannot be shipped is not a
# fix. This workflow is the missing half.
#
# ── WHAT IT SHIPS, AND WHY THAT IS ENOUGH ─────────────────────────────────
#
# One Cloudflare Pages deploy, containing:
#
#   deploy/pages/_worker.js   the routing brain — the thing that was broken
#   dist/*/index.html         the public pages, rendered from the DOM Cloud
#                             origin (public, always reachable from a runner)
#   dist/_next/static         the client assets the runner's own build emits,
#                             PLUS every asset the rendered HTML references that
#                             the runner's build did not produce, fetched from
#                             the origin (build-static-site.mjs step "extra")
#
# It does NOT touch either origin. It does not need to: a laptop-rendered page
# whose chunk the snapshot lacks is now rescued from the laptop by the worker
# (see _worker.js and web/scripts/check-worker.mjs), and a DOM Cloud-rendered
# page finds its chunks in the snapshot rendered from that same origin. Either
# way the page arrives styled. The one thing this cannot do is publish a
# snapshot while BOTH origins are down — build-static-site refuses to render
# from a dead server, on purpose, and the job goes red saying so.
#
# ── WHAT A PHONE HAS TO DO, ONCE ──────────────────────────────────────────
#
# Two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN    a token with "Cloudflare Pages: Edit" on the account
#                           (dash.cloudflare.com → My Profile → API Tokens)
#   CLOUDFLARE_ACCOUNT_ID   from the right-hand column of any zone's Overview
#
# After that, merging to main is the deploy, and the Actions tab is the log.
# "Run workflow" on this file re-publishes without a commit.

name: Publish site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/**"
      - "deploy/pages/**"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

# One publish at a time. Two runners racing `wrangler pages deploy` would leave
# whichever finished last as production, which is not necessarily the newer one.
concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The origin the snapshot is rendered from and the dist dir whose client
      # assets ship beside it. Both are build-static-site.mjs's defaults, stated
      # here so the pairing is visible in the log rather than implied.
      SNAPSHOT_BASE: https://honeymoney-app.domcloud.dev
      NEXT_DIST_DIR: .next-dc

    steps:
      # First, and before anything is installed or built: are the secrets there?
      #
      # Run #1 on 2026-09-08 proved every other step on a real runner — the
      # worker check, the build, the snapshot rendered from the live origin —
      # and then died at the upload with wrangler's "set a CLOUDFLARE_API_TOKEN".
      # Eighty seconds of green output ending in a red line about credentials,
      # read on a phone. The person merging cannot see repository secrets from
      # the PR, so the workflow has to say what is missing in its own words, at
      # the top, in a way that is the first thing the log shows.
      - name: Check publish secrets are configured
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          missing=""
          [ "$HAS_TOKEN" = "true" ]   || missing="$missing CLOUDFLARE_API_TOKEN"
          [ "$HAS_ACCOUNT" = "true" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Publish cannot run — repository secret(s) missing::$missing"
            echo
            echo "Add them at: https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
            echo
            echo "  CLOUDFLARE_API_TOKEN    dash.cloudflare.com → My Profile → API Tokens → Create Token"
            echo "                          → permission 'Cloudflare Pages: Edit' on the account"
            echo "  CLOUDFLARE_ACCOUNT_ID   dash.cloudflare.com → any site → Overview → right-hand column"
            echo
            echo "Then re-run this workflow from the Actions tab. Nothing was uploaded."
            exit 1
          fi
          echo "both secrets present"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund

      # The front door, proven before anything is built or uploaded. Four
      # seconds, offline. A worker that mis-routes ships a site that looks up
      # and is not, so this is the first gate and not the last.
      - name: Check the worker routes as documented
        working-directory: web
        run: npm run check:worker

      # The runner's own build supplies the bulk of /_next/static. Where the
      # origin's HTML references a hash this build did not produce, the
      # snapshot script fetches that file from the origin, and its step 5
      # refuses to finish if any referenced chunk is still missing.
      - name: Build client assets
        working-directory: web
        run: npm run build

      # Wake the origin before rendering from it. Run #4 on 2026-09-08 failed
      # here with "Can't reach https://honeymoney-app.domcloud.dev": a Passenger
      # process reaped after idle, on a host too short of memory to respawn it
      # inside the 10s the snapshot script allows. The same host had answered
      # seven minutes earlier. Nothing about the publish was wrong; nobody had
      # waited long enough for the origin to come up.
      #
      # So wait. Ninety seconds per knock, several knocks, at the origin's own
      # hostname so the worker's 2.5s navigation budget is not in the way. If
      # it can come up at all this brings it up, and once resident it answers
      # the render and every visitor after it. If it cannot, the log says which
      # origin and this step fails plainly rather than the render failing
      # cryptically — and that case is a person's to fix, not a re-run's.
      - name: Wake the origin
        shell: bash
        run: |
          knock() {
            local url="$1" tries="$2" i code
            for i in $(seq 1 "$tries"); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 \
                     -H 'User-Agent: honeymoney-publish/1 (+https://honeymoney.app)' \
                     -H 'Cache-Control: no-cache' "$url" 2>/dev/null || echo 000)
              echo "  attempt $i → $code   $url"
              [ "$code" = "200" ] && return 0
              sleep 5
            done
            return 1
          }
          echo "PocketBase:"; knock https://honeymoney-pb.domcloud.dev/api/health 2 || echo "  (PocketBase not answering — the app will render its degraded notice)"
          echo "Origin:"
          if knock "$SNAPSHOT_BASE/api/health" 5; then
            echo "origin is up"
          else
            echo "::error title=Origin unreachable::$SNAPSHOT_BASE did not answer a 90-second knock, five times. The publish cannot render a snapshot from an origin that is down. This is the origin host, not the edge: restart the app on DOM Cloud, or wake the laptop and re-run."
            exit 1
          fi

      - name: Render the snapshot from the live origin
        run: node scripts/build-static-site.mjs --base "$SNAPSHOT_BASE"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/pages
          # --branch=main marks this the production deployment rather than a
          # preview; the project name comes from wrangler.toml.
          command: pages deploy --branch=main

      # The same check site:publish runs. It now distinguishes "the edge is
      # missing assets the origin references" (a failed publish) from "no
      # origin route answered" (an origin problem; the publish itself is fine)
      # and says which. Both go red here on purpose — a green run must mean the
      # site was seen working, not merely uploaded.
      - name: Verify edge and origin agree
        working-directory: web
        run: node scripts/check-edge.mjs --after-deploy

  # The warmer: a Worker whose only job is to knock on the origin every three
  # minutes so that no visitor is the one who pays the Passenger respawn.
  # deploy/warm/README.md explains it; what it never had was a way to be
  # deployed from anywhere but a laptop. On 2026-09-08 the origin was cold at
  # 10:02 and again at 10:08 — the warmer was not running — and the site sat
  # "resting" for the rest of the afternoon. Deploying it here, with the same
  # token, every time the site is published, means it cannot quietly not exist.
  # Independent of the publish job: a broken snapshot must not stop the warmer
  # and vice versa.
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the warmer
        id: warmer
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/warm
          command: deploy
      # Prove the schedule is real, not merely accepted: knock on the warmer's
      # own address, which runs the same code the cron runs. The address comes
      # from wrangler's own output — the Pages token cannot read the account's
      # workers.dev subdomain through the API, which is how run #6 skipped this.
      - name: Run the warmer once by hand
        shell: bash
        env:
          WARMER_URL: ${{ steps.warmer.outputs.deployment-url }}
        run: |
          if [ -z "$WARMER_URL" ]; then echo "wrangler reported no URL — skipping the manual knock (the schedule is still installed)"; exit 0; fi
          echo "knocking via $WARMER_URL"
          curl -sS --max-time 60 "$WARMER_URL" || echo "(the knock itself failed; the schedule is still installed)"
