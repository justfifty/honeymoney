# ─────────────────────────────────────────────────────────────────────────────
# HoneyMoney — PocketBase on DOM Cloud  ·  OPTIONAL UPGRADE (Kit plan or higher)
#
# DO NOT PASTE THIS ONE. The project runs on Lite via pb.deploy.yml, which is
# the baseline and is sufficient. This file is kept for one reason: so that IF
# the plan is ever raised to Kit, the daemon arrangement already exists and
# nobody has to work it out again under pressure.
#
# Nothing here is required. The single thing it buys over pb.deploy.yml is
# PocketBase's own nightly cron firing in-process, and that job is already done
# from outside by deploy/backup-pocketbase.ps1 on a schedule that does not care
# what the host's process policy is. Upgrade for traffic or storage if those
# ever bind — not for this.
#
# Why `features: docker` when nothing here is containerised: DOM Cloud's docs
# state that enabling it lifts the 3-hour process cap for EVERY app on the
# site, "no matter if it actually uses Docker or not". That is what buys the
# plain background process below. The feature starts at the Kit plan; on Free
# or Lite this file is a fair-use violation, not a configuration choice — use
# pb.deploy.yml there.
#
# PocketBase binds 127.0.0.1:8090 and NGINX proxies to it, so there is exactly
# one process against data.db and its port never moves — which is what lets
# the Next.js app address it as a fixed origin.
# ─────────────────────────────────────────────────────────────────────────────

features:
  - docker            # lifts the 3-hour process cap for the whole site
  - ssl letsencrypt

nginx:
  root: public_html/public
  locations:
    - match: /
      proxy_pass: http://127.0.0.1:8090
    - match: /_/
      proxy_pass: http://127.0.0.1:8090
      add_header: "X-Robots-Tag \"noindex, nofollow\""

commands:
  - mkdir -p ~/public_html/public ~/public_html/pb_data ~/logs
  - touch ~/.env.pocketbase && chmod 600 ~/.env.pocketbase
  # Pinned to the version that wrote pb_data on the laptop — see pb.deploy.yml
  # for why a newer binary is a one-way door for the ledger.
  - cd ~/public_html && test -x pocketbase || {
      ARCH=$(uname -m);
      case "$ARCH" in aarch64|arm64) PBARCH=arm64 ;; x86_64|amd64) PBARCH=amd64 ;; *) echo "unsupported arch $ARCH" && exit 1 ;; esac;
      curl -sSLo pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v0.39.6/pocketbase_0.39.6_linux_${PBARCH}.zip";
      unzip -o pb.zip pocketbase && rm pb.zip && chmod +x pocketbase;
    }
  # >>> embedded pb-run.sh — generated by sync-embeds.mjs; edit pb-run.sh, not this.
  - |
    cat > ~/public_html/pb-run.sh <<'HM_PB_RUN_SH'
    #!/usr/bin/env bash
    # Start PocketBase if it is not already running. Idempotent by design: this is
    # both the starter (deploy) and the watchdog (hourly cron), and running it
    # twice must never produce a second process against data.db.
    #
    # Kit-plan variant only — on Free/Lite a process living past 3 hours is a fair
    # use violation, not a configuration choice. See pb.deploy.yml.
    set -euo pipefail

    APP_DIR="$HOME/public_html"
    PORT=8090
    PIDFILE="$APP_DIR/pb.pid"

    if [ -f "$PIDFILE" ] && kill -0 "$(cat "$PIDFILE")" 2>/dev/null; then
      exit 0                                  # already up; say nothing
    fi

    # A stale pidfile and a live process can disagree — e.g. after the platform
    # restarted the site. Ask the port, which is the thing that actually matters.
    if command -v ss >/dev/null 2>&1 && ss -ltn "sport = :$PORT" 2>/dev/null | grep -q ":$PORT"; then
      exit 0
    fi

    cd "$APP_DIR"
    mkdir -p "$HOME/logs"

    # ⚠️ --encryptionEnv is not optional. Settings encryption was switched on for
    # this database on 2026-08-23, and a PocketBase started without the key does
    # not merely lose the settings block — it refuses to start at all:
    #     invalid settings db data or missing encryption key ""
    PB_ARGS=(serve --http "127.0.0.1:$PORT" --dir ./pb_data --migrationsDir ./pb_migrations)

    if [ -f "$HOME/.env.pocketbase" ]; then
      set -a
      # shellcheck disable=SC1091
      . "$HOME/.env.pocketbase"
      set +a
    fi

    if [ -n "${PB_ENCRYPTION_KEY:-}" ]; then
      PB_ARGS+=(--encryptionEnv=PB_ENCRYPTION_KEY)
    else
      echo "WARNING: no PB_ENCRYPTION_KEY — this will fail against an encrypted pb_data" >&2
    fi

    nohup ./pocketbase "${PB_ARGS[@]}" >> "$HOME/logs/pocketbase.log" 2>&1 &

    echo $! > "$PIDFILE"
    sleep 2
    kill -0 "$(cat "$PIDFILE")" 2>/dev/null \
      && echo "$(date -Is) started PocketBase pid $(cat "$PIDFILE")" \
      || { echo "$(date -Is) PocketBase failed to start; see ~/logs/pocketbase.log"; exit 1; }
    HM_PB_RUN_SH
    chmod +x ~/public_html/pb-run.sh
  # <<< end embedded pb-run.sh
  # pb-run.sh is idempotent: it exits quietly if PocketBase is already up, so
  # the same script serves as the starter here and as the hourly watchdog.
  - bash ~/public_html/pb-run.sh
  # Hourly, not minutely: DOM Cloud removes crons that run more often than
  # hourly. An hour of downtime after an unexpected exit is the price.
  - (crontab -l 2>/dev/null | grep -v pb-run.sh; echo "17 * * * * bash $HOME/public_html/pb-run.sh >> $HOME/logs/pb-watchdog.log 2>&1") | crontab -
