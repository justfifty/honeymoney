# ─────────────────────────────────────────────────────────────────────────────
# HoneyMoney — PocketBase on DOM Cloud  ·  ***THIS IS THE ONE TO PASTE***
#
# The plan is Lite, and this file is the deployment for it. It is the baseline,
# not a downgrade: paste it into the PocketBase site's Setup -> Deploy tab and
# the site is done. pb.deploy.kit.yml is a LATER OPTION, not a prerequisite,
# and nothing in this project requires it.
#
# The site is up 24/7 on this file. Saying so explicitly because the 3-hour
# process cap reads like it says otherwise: NGINX starts PocketBase when a
# request arrives, so a visitor at 4am gets an answer. The cap is on a process
# sitting resident BETWEEN requests, which is not what uptime means here.
#
# What this variant genuinely does not give you, and what is done about it:
#   • PocketBase's OWN nightly cron cannot be relied on to fire — at 3am with
#     no visitors there is no process for the cron to live in. HANDLED, and it
#     is the reason the backup is triggered from outside:
#       deploy/backup-pocketbase.ps1 -PbUrl https://pb.honeymoney.app
#     scheduled as the HoneyMoney-Backup task. Not a stopgap "until Kit" — it
#     is a backup trigger that does not depend on the host's scheduler at all,
#     which is the more robust arrangement on any plan.
#   • The first request after an idle period pays PocketBase's cold start. It
#     is a SQLite open, not a build; and /api/health is what spawns the app, so
#     the nightly backup trigger doubles as a warm-up.
#   • Open-source Passenger has no per-app instance cap, so under real
#     concurrency more than one process could open the same data.db. WAL keeps
#     that safe against corruption; the residual risk is two processes
#     disagreeing about cached settings. Proportion matters: this is a
#     household ledger with single-digit signed-in users, and Pages fronts
#     every public page, so the concurrency that would trigger it is not the
#     traffic this origin sees. Revisit if that stops being true.
# ─────────────────────────────────────────────────────────────────────────────

features:
  - ssl letsencrypt

nginx:
  root: public_html/public
  passenger:
    enabled: "on"
    app_root: public_html
    # PocketBase must bind IPv4 loopback for Passenger to find it.
    # A wrapper, not the binary directly: the settings-encryption key has to be
    # sourced from ~/.env.pocketbase, and it must not be written into this file,
    # which is committed. See pb-start.sh.
    app_start_command: bash ./pb-start.sh
    # NOTE: `min_instances` was here and did nothing. DOM Cloud's deploy runner
    # copies only a fixed allowlist of passenger keys into the NGINX config
    # (src/executor/nginx.js, `passengerKeys`) and drops the rest SILENTLY —
    # no error, no warning, just a setting that was never applied. Checked
    # against their source 2026-08-24. The allowlist is: enabled, app_env,
    # env_var_list, set_header_list, app_start_command, app_type, startup_file,
    # ruby, nodejs, python, meteor_app_settings, friendly_error_pages,
    # document_root, base_uri, app_root, sticky_sessions.

# NOTE: there is no `locations:` block, and the reason is the same allowlist.
# The superuser UI at /_/ is the one door that can export the whole ledger, so
# it was given `add_header: X-Robots-Tag "noindex, nofollow"` — but `add_header`
# is NOT in the runner's `locationKeys` allowlist either (root, alias, rewrite,
# try_files, return, index, expires, allow, deny, autoindex, proxy_pass,
# limit_except, limit_rate, limit_rate_after, default_type). It would have been
# dropped in silence, and the admin UI would have been indexable while the file
# said otherwise. robots.txt below is the part that actually applies; if you
# want the header too, add it as a Cloudflare Transform Rule, which is in front
# of this origin anyway.

commands:
  # Pinned to the version that wrote pb_data on the laptop. A NEWER PocketBase
  # runs its own one-way data migrations on first start; discovering that on
  # the copy that has become the only copy is unrecoverable. Upgrade later, on
  # purpose, with a backup in hand.
  - mkdir -p ~/public_html/public ~/public_html/pb_data
  # Keep the superuser UI out of search results. This is a real file in the
  # document root, so NGINX answers it before Passenger ever sees the request —
  # unlike the add_header above, which the runner would have discarded.
  # Block scalar, not a plain one: the payload contains ": " and a leading "*",
  # which YAML reads as a mapping and an alias respectively.
  - |
    printf 'User-agent: *\nDisallow: /\n' > ~/public_html/public/robots.txt
  - cd ~/public_html && test -x pocketbase || {
      ARCH=$(uname -m);
      case "$ARCH" in aarch64|arm64) PBARCH=arm64 ;; x86_64|amd64) PBARCH=amd64 ;; *) echo "unsupported arch $ARCH" && exit 1 ;; esac;
      echo "installing PocketBase 0.39.6 for linux_$PBARCH";
      curl -sSLo pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v0.39.6/pocketbase_0.39.6_linux_${PBARCH}.zip";
      unzip -o pb.zip pocketbase && rm pb.zip && chmod +x pocketbase;
    }
  - touch ~/.env.pocketbase && chmod 600 ~/.env.pocketbase
  # Passenger runs bash ./pb-start.sh below, and nothing else on this host
  # would ever have created that file: the repo is private, so there is no
  # `source:` git clone, and an scp cannot happen before this script runs.
  # >>> embedded pb-start.sh — generated by sync-embeds.mjs; edit pb-start.sh, not this.
  - |
    cat > ~/public_html/pb-start.sh <<'HM_PB_START_SH'
    #!/usr/bin/env bash
    # Passenger's app_start_command for PocketBase (pb.deploy.yml, any plan).
    #
    # ⚠️ --encryptionEnv is not optional. Settings encryption was switched on for
    # this database on 2026-08-23, and a PocketBase started without the key does
    # not merely lose the settings block — it refuses to start at all:
    #     invalid settings db data or missing encryption key ""
    # So the key has to reach the host before pb_data does, or the migrated ledger
    # is a file nobody can open. ~/.env.pocketbase holds it, chmod 600.
    set -euo pipefail

    cd "$(dirname "$0")"

    PB_ARGS=(serve --http "127.0.0.1:${PORT:-8090}" --dir ./pb_data --migrationsDir ./pb_migrations)

    if [ -f "$HOME/.env.pocketbase" ]; then
      set -a
      # shellcheck disable=SC1091
      . "$HOME/.env.pocketbase"
      set +a
    fi

    if [ -n "${PB_ENCRYPTION_KEY:-}" ]; then
      PB_ARGS+=(--encryptionEnv=PB_ENCRYPTION_KEY)
    else
      echo "WARNING: no PB_ENCRYPTION_KEY — this will fail against an encrypted pb_data" >&2
    fi

    exec ./pocketbase "${PB_ARGS[@]}"
    HM_PB_START_SH
    chmod +x ~/public_html/pb-start.sh
  # <<< end embedded pb-start.sh
  - cd ~/public_html && ./pocketbase --version
